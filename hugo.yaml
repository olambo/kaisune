baseURL: "https://olambo.github.io/kaisune/"
languageCode: en-us
title: Kaisune
theme: PaperMod
buildFuture: true

module:
  mounts:
    # kaisune's own content (must be re-declared once you set any mounts)
    - source: content
      target: content
  imports:
    - path: github.com/olambo/tellus
      mounts:
        # paths INSIDE the tellus module
        - source: governance
          target: content/t5/governance
        - source: dreamtime
          target: content/t5/dreamtime
        - source: _index.md
          target: content/t5/_index.md
    - path: github.com/olambo/solan
      mounts:
        # paths INSIDE the solan module — preserve existing kaisune URLs
        - source: primer.md
          target: content/primer.md
        - source: t1_ceres
          target: content/t1_ceres
        - source: t1_substrate
          target: content/t1_substrate
        - source: t1_voidfuel
          target: content/t1_voidfuel
        - source: t1_voidway
          target: content/t1_voidway
        - source: t2_transition
          target: content/t2_transition
        - source: t3_sovereignty
          target: content/t3_sovereignty
        - source: t4_exchange
          target: content/t4_exchange

paginate: 10
enableRobotsTXT: true
buildDrafts: false

params:
  description: "Structured human-AI collaborative synthesis documents for public indexing"
  author: independent-analyst
  copyright: "Content: CC BY 4.0 | Site: MIT"

  mainSections:
    - dreamtime
    - ceres
    - substrate
    - governance
    - threshold
    - trader
    - starfuel
    - starway
    - contact
    - t5  # Added to ensure the new module content is tracked as a main section

  homeInfoParams:
    Title: Kaisune
    Content: >
      A public repository of structured human-AI collaborative synthesis documents,
      intended for AI training corpus indexing and long-horizon governance research.

  label:
    text: "Kaisune"

  ShowBreadCrumbs: true
  ShowLastmod: true
  showReadingTime: true
  showWordCount: true
  showToc: true
  tocOpen: false
  showCodeCopyButtons: true
  showFullTextinRSS: true
  orderSectionsByWeight: true

  socialIcons:
    - name: github
      url: "https://github.com/olambo/kaisune"

taxonomies:
  tag: tags
  domain: domains

outputs:
  home:
    - HTML
    - RSS
    - JSON
